<script>
"use strict";
let colors = ["red","green","blue","purple","pink", "teal", "orange"];
let foods = ["cake", "burger","pasta","strawberry","cookie","potato"]; // add some foods

function createList(listElement,array){
	for (let item of array) {
            let itemChosen = document.createElement('li');
            itemChosen.textContent = item;
        	listElement.appendChild(itemChosen);
    }
}

createList(document.getElementById('colorsList'), colors);
createList(document.getElementById('foodsList'), foods);
